<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karnival POLYCC Mega 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body">
    <div class="poster">

    <header class="header">
        <h2>KARNIVAL POLYCC MEGA 2026</h2>
    </header>

    <nav class="nav">
        <a href="index.html">Home|</a>
        <a href="gallery.html">Gallery |</a>
        <a href="register.html">Register</a>
    </nav>

    <div class="content">
        <h3>BORANG PENDAFTARAN PESERTA</h3>
        
        <form action="#" method="POST">
            
            <div class="form-group">
                <label>1. Nama Penuh:</label>
                <input type="text" name="namaPenuh" placeholder="Masukkan nama penuh" required>
            </div>

            <div class="form-group">
                <label>2. Umur (Wajib):</label>
                <input type="number" name="umur" placeholder="Masukkan umur" required>
            </div>

            <div class="form-group">
                <label>3. Kategori Pertandingan:</label>
                <input type="radio" name="kategori" value="drone" required> Drone
                <input type="radio" name="kategori" value="robotics"> AI Robotics
                <input type="radio" name="kategori" value="code"> Code Design
                <input type="radio" name="kategori" value="cook"> Cooking
                <input type="radio" name="kategori" value="3d"> 3D Sketch / 3D Art
            </div>

            <div class="form-group">
                <label>4. Institusi:</label>
                <select name="institusi" required>
                    <option value="">-- Pilih Institusi --</option>
                    <option value="politeknik">Politeknik</option>
                    <option value="kolej">Kolej Komuniti</option>
                </select>
            </div>

            <div class="form-group">
                <label>5. Catatan Tambahan:</label>
                <textarea name="catatan" rows="4" placeholder="Tulis catatan jika ada..."></textarea>
            </div>

            <button type="submit" class="btn-submit">HANTAR PENDAFTARAN</button>

        </form>
    </div>
    <footer class="footer">
        <p>2026 Webiture Enterprise. All Rights Reswerved.</p>
    </footer>
    </div>
</body>
</html>
